apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: website-reliability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80